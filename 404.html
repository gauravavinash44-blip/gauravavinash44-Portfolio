<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://gauravavinash44-blip.github.io/portfolio/">
  <link rel="canonical" href="https://gauravavinash44-blip.github.io/portfolio/">
  <script>
    (function () {
      var base = "https://gauravavinash44-blip.github.io/portfolio";
      var oldPrefix = "/gauravavinash44-Portfolio";
      var path = location.pathname || "/";
      if (path.toLowerCase().indexOf(oldPrefix.toLowerCase()) === 0) {
        path = path.slice(oldPrefix.length) || "/";
      }
      location.replace(base + path + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>This site moved to <a href="https://gauravavinash44-blip.github.io/portfolio/">gauravavinash44-blip.github.io/portfolio</a>.</p>
</body>
</html>
