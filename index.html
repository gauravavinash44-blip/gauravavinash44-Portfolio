<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaurav Avinash - Product Designer</title>
  <meta name="description" content="Product Designer focused on Enterprise SaaS, AI products, and Fintech. Human–AI interaction, complex workflows, and measurable outcomes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=40">
  <link rel="stylesheet" href="./assets/design-playground/design-playground.css?v=13">
  <link rel="stylesheet" href="./assets/portfolio-assistant/portfolio-assistant.css?v=17">
</head>
<body>
  <div id="root"></div>

  <!-- Design Playground: modal host + hidden data section for legacy init -->
  <section class="design-playground ga-pg-host" id="design-playground" aria-hidden="true" hidden>
    <div class="pg-tabs" role="tablist" aria-hidden="true">
      <button class="pg-tab" type="button" role="tab" data-category="interface" aria-selected="true" id="pgTabInterface">Interface</button>
      <button class="pg-tab" type="button" role="tab" data-category="motion" aria-selected="false" id="pgTabMotion">Motion</button>
      <span class="pg-tab-indicator" aria-hidden="true"></span>
    </div>
    <div class="pg-panels">
      <div class="pg-panel" id="pgPanelInterface" data-panel="interface" role="tabpanel">
        <div class="pg-grid" data-grid="interface"></div>
      </div>
      <div class="pg-panel" id="pgPanelMotion" data-panel="motion" role="tabpanel" hidden>
        <div class="pg-grid" data-grid="motion"></div>
      </div>
    </div>
  </section>

  <div class="pg-modal" id="pgModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pgModalTitle">
    <div class="pg-modal-backdrop" data-pg-dismiss></div>
    <div class="pg-modal-dialog" role="document">
      <button class="pg-modal-close" type="button" aria-label="Close design preview">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="pg-modal-body"></div>
    </div>
  </div>

  <button class="pa-fab" id="paFab" type="button" aria-label="Open Portfolio Assistant" aria-controls="paModal" aria-expanded="false">
    <span class="pa-fab-icon" aria-hidden="true">
      <span class="pa-fab-chat">
        <svg class="pa-fab-chat-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 0C21.812 0 23.566 0.244 25.234 0.696C24.1866 2.82195 23.7922 5.21044 24.1004 7.56027C24.4087 9.9101 25.4058 12.116 26.9661 13.8999C28.5265 15.6837 30.58 16.9656 32.8679 17.5839C35.1558 18.2022 37.5756 18.1291 39.822 17.374C39.938 18.234 39.9973 19.1093 40 20C40 31.046 31.046 40 20 40H1.51619e-05L5.85802 34.142C3.99818 32.2868 2.52323 30.0824 1.51793 27.6555C0.512627 25.2286 -0.00322417 22.6269 1.51619e-05 20C1.51619e-05 8.954 8.95402 0 20 0ZM12 22C12 24.1217 12.8429 26.1566 14.3432 27.6569C15.8435 29.1571 17.8783 30 20 30C22.1217 30 24.1566 29.1571 25.6569 27.6569C27.1572 26.1566 28 24.1217 28 22H12Z" fill="currentColor"/>
        </svg>
        <span class="pa-fab-star-wrap">
          <span class="pa-fab-star-inner">
            <svg class="pa-fab-star" viewBox="0 0 17.7346 17.7346" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M7.91649 0.430275C8.08894 -0.143426 9.64564 -0.143425 9.81808 0.430276C10.3596 2.23187 11.177 4.15467 12.3785 5.35611C13.5799 6.55755 15.5027 7.37498 17.3043 7.9165C17.878 8.08894 17.878 9.64564 17.3043 9.81808C15.5027 10.3596 13.5799 11.177 12.3785 12.3785C11.177 13.5799 10.3596 15.5027 9.81808 17.3043C9.64564 17.878 8.08894 17.878 7.91649 17.3043C7.37498 15.5027 6.55754 13.5799 5.35611 12.3785C4.15467 11.177 2.23187 10.3596 0.430275 9.81808C-0.143426 9.64564 -0.143425 8.08894 0.430276 7.91649C2.23187 7.37498 4.15467 6.55754 5.35611 5.35611C6.55754 4.15467 7.37498 2.23187 7.91649 0.430275Z" fill="currentColor"/>
            </svg>
          </span>
        </span>
      </span>
    </span>
    <span class="pa-fab-label">Portfolio Assistant</span>
  </button>

  <div class="pa-modal" id="paModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="paModalTitle">
    <div class="pa-modal-backdrop"></div>
    <div class="pa-modal-dialog">
      <div class="pa-card">
        <div class="pa-card-header">
          <div class="pa-card-heading">
            <div class="pa-card-title" id="paModalTitle">Portfolio Assistant</div>
            <div class="pa-card-caption">Ask about experience, projects, or design process</div>
          </div>
          <div class="pa-header-actions">
            <button
              class="pa-speaker"
              id="paSpeaker"
              type="button"
              aria-label="Unmute voice narration"
              aria-pressed="false"
              title="Voice narration (muted)"
            >
              <svg class="pa-speaker-icon pa-speaker-icon--muted" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <path d="M11 5 6 9H3v6h3l5 4V5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="m16 9 5 5M21 9l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <svg class="pa-speaker-icon pa-speaker-icon--on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" hidden>
                <path d="M11 5 6 9H3v6h3l5 4V5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="pa-modal-close" type="button" aria-label="Close Portfolio Assistant">×</button>
          </div>
        </div>
        <div class="pa-messages" id="paMessages" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form class="pa-input-row" id="paForm">
          <input
            class="pa-input"
            id="paInput"
            type="text"
            name="message"
            placeholder="Ask about my work..."
            autocomplete="off"
            aria-label="Ask about my work"
          >
          <button class="pa-send" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="./app.js?v=33"></script>
  <script src="./assets/design-playground/design-playground.js?v=12"></script>
  <script src="./assets/portfolio-assistant/portfolio-assistant.js?v=7"></script>
</body>
</html>
